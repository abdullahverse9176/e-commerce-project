name: ecommerce-prod

services:

  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongodb-prod
    restart: unless-stopped

    # MongoDB is only accessible from the EC2 host,
    # not publicly from the internet.
    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo-prod-data:/data/db

    networks:
      - ecommerce-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    image: ${DOCKERHUB_USERNAME}/ecommerce-backend:latest

    container_name: ecommerce-backend-prod
    restart: unless-stopped

    # Backend is NOT exposed directly to the internet.
    # Nginx/frontend communicates with it through Docker network.
    expose:
      - "5000"

    env_file:
      - path: ./backend/.env
        required: false

    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/ecommerce}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - ecommerce-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    image: ${DOCKERHUB_USERNAME}/ecommerce-frontend:latest

    container_name: ecommerce-frontend-prod
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - ecommerce-network


volumes:
  mongo-prod-data:
    driver: local


networks:
  ecommerce-network:
    driver: bridge