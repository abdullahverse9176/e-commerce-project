services:
  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ./backend/src:/app/src
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=${PORT:-5000}
      - NODE_ENV=${NODE_ENV:-development}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/ecommerce}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_key_12345}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:5000}
    depends_on:
      - backend

volumes:
  mongo-data:



